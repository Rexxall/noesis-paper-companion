<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f2f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1b1d" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>Noesis Paper Reader</title>
  <style>
    /* Quiet UI around the paper: neutral greys, one blue accent, system type. */
    :root {
      color-scheme: light;
      --bg:#f2f2f0; --rail:#ebebe8; --card:#fff; --field:#f6f6f4; --hover:rgba(0,0,0,.045);
      --ink:#1c1c1e; --ink2:#55555a; --mute:#8e8e93; --line:#dcdcd8; --hair:rgba(0,0,0,.06);
      --accent:#3559c7; --accent-soft:#e6ecfb; --accent-ink:#fff;
      --mark:rgba(255,214,10,.36); --ai-mark:rgba(53,89,199,.16); --note-bar:#e3b400;
      --ok:#2f8a57; --warn:#b26a00; --bad:#c0392b;
      --shadow-sm:0 1px 2px rgba(0,0,0,.07); --shadow-pop:0 12px 32px -10px rgba(0,0,0,.28),0 0 0 1px rgba(0,0,0,.05);
      --page-filter:none;
      --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans","Noto Sans CJK SC",sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg:#1b1b1d; --rail:#222225; --card:#2a2a2d; --field:#232326; --hover:rgba(255,255,255,.06);
        --ink:#f2f2f3; --ink2:#c5c5c9; --mute:#8d8d93; --line:#3a3a3e; --hair:rgba(255,255,255,.07);
        --accent:#8aa4ff; --accent-soft:rgba(138,164,255,.16); --accent-ink:#111;
        --mark:rgba(255,214,10,.42); --ai-mark:rgba(110,140,255,.28);
        --ok:#5cc28a; --warn:#e0a24a; --bad:#ff7b6b;
        --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-pop:0 14px 36px -10px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.06);
        --page-filter:brightness(.9);
      }
    }
    * { box-sizing:border-box; }
    html, body { height:100%; }
    body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.55 var(--sans); overflow:hidden; -webkit-font-smoothing:antialiased; }
    button, input, textarea, select { font:inherit; color:inherit; }
    button { cursor:pointer; border:0; background:none; padding:0; }
    :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }
    textarea, input, select { width:100%; border:1px solid transparent; border-radius:8px; background:var(--field); padding:8px 10px; resize:vertical; transition:border-color .15s, background .15s; }
    textarea:focus, input:focus, select:focus { outline:none; border-color:var(--accent); background:var(--card); }
    ::placeholder { color:var(--mute); }
    .btn { padding:5px 12px; border-radius:8px; background:var(--hover); font-size:12.5px; color:var(--ink2); white-space:nowrap; transition:background .15s; }
    .btn:hover { background:var(--line); color:var(--ink); }
    .btn.dark { background:var(--ink); color:var(--bg); }
    .btn.dark:hover { opacity:.88; }
    .link { color:var(--accent); font-size:12.5px; }
    .link:hover { text-decoration:underline; }
    .quiet { color:var(--mute); font-size:12px; }
    .hidden { display:none !important; }

    /* Top bar */
    .app { height:100vh; display:grid; grid-template-rows:50px 1fr; }
    .top { display:flex; align-items:center; gap:12px; padding:0 14px; border-bottom:1px solid var(--hair); min-width:0; background:var(--bg); }
    .brand { font-weight:600; font-size:13px; color:var(--mute); letter-spacing:.02em; }
    #paperTitle { margin:0; font-size:14px; font-weight:500; min-width:0; max-width:420px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; outline:none; border-radius:6px; padding:3px 6px; }
    #paperTitle:hover { background:var(--hover); }
    #paperTitle:focus { white-space:normal; background:var(--card); box-shadow:var(--shadow-pop); }
    .passes { margin:0 auto; display:flex; background:var(--rail); border-radius:10px; padding:3px; gap:2px; flex-shrink:0; }
    .passes button { font-size:12.5px; padding:5px 13px; border-radius:8px; color:var(--ink2); display:flex; align-items:center; gap:7px; transition:background .15s, color .15s; }
    .passes button:hover { color:var(--ink); }
    .passes button b { font-size:10.5px; width:17px; height:17px; border-radius:50%; display:grid; place-items:center; background:var(--line); color:var(--card); }
    .passes button.done b { background:var(--ok); color:#fff; font-size:0; }
    .passes button.done b::after { content:"✓"; font-size:10.5px; }
    .passes button.is-on { background:var(--card); color:var(--ink); box-shadow:var(--shadow-sm); }
    .passes button.is-on b { background:var(--accent); color:var(--accent-ink); }
    .top .tools { display:flex; gap:4px; align-items:center; flex-shrink:0; }
    .top .tools .btn { background:none; }
    .top .tools .btn:hover { background:var(--hover); }
    .top .tools .btn.dark { background:var(--ink); color:var(--bg); margin-left:4px; }
    #openSource { font-size:12.5px; color:var(--ink2); text-decoration:none; padding:5px 8px; border-radius:8px; }
    #openSource:hover { background:var(--hover); }
    #railToggle { display:none; }

    .body { display:grid; grid-template-columns:248px minmax(0,1fr); min-height:0; }
    body[data-pass=recap] .body { grid-template-columns:minmax(0,1fr) 480px; }
    body[data-pass=recap] .rail { display:none; }

    /* Left rail */
    .rail { background:var(--rail); overflow:auto; padding:16px 12px 28px; font-size:12.5px; scrollbar-width:thin; }
    .rail h4 { margin:20px 6px 6px; font-size:11px; font-weight:600; color:var(--mute); letter-spacing:.04em; display:flex; justify-content:space-between; align-items:baseline; }
    .rail h4:first-child { margin-top:0; }
    .rail h4 span { font-weight:500; letter-spacing:0; }
    .rail-skel, .rail-read { display:none; }
    body[data-pass=skeleton] .rail-skel, body[data-pass=read] .rail-read { display:block; }
    .rail-skel > p.quiet { line-height:1.6; }
    .step { display:flex; gap:9px; align-items:flex-start; padding:7px 6px; border-radius:8px; color:var(--ink); }
    .step:hover { background:var(--hover); }
    .step input { width:auto; margin-top:3px; accent-color:var(--ok); }
    .step .link { font-size:13px; }
    .skel-figs { margin:0 0 6px; display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; padding:0 4px; }
    #skelAnswer { font-size:13px; }
    .toc-row { display:flex; gap:6px; align-items:flex-start; padding:4px 6px; border-radius:7px; }
    .toc-row:hover { background:var(--hover); }
    .toc-row.here { background:var(--card); box-shadow:var(--shadow-sm); }
    .toc-row .chk { width:16px; flex-shrink:0; color:var(--mute); font-size:11px; line-height:20px; opacity:.6; }
    .toc-row .chk:hover { opacity:1; }
    .toc-row .chk.on { color:var(--ok); opacity:1; }
    .toc-row.here .chk:not(.on) { color:var(--accent); opacity:1; }
    .toc-row button.go { text-align:left; color:var(--ink2); flex:1; line-height:20px; }
    .toc-row.here button.go { color:var(--ink); }
    .toc-row.l2 button.go { padding-left:12px; font-size:12px; color:var(--mute); }
    #figList { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px; padding:0 4px; }
    .fig-card { display:flex; flex-direction:column; gap:4px; background:var(--card); border-radius:8px; padding:6px; text-align:left; box-shadow:var(--shadow-sm); transition:transform .12s; }
    .fig-card:hover { transform:translateY(-1px); }
    .fig-card { min-width:0; }
    .fig-card .thumb { height:60px; border-radius:5px; background:#fff; display:grid; place-items:center; overflow:hidden; }
    .fig-card .thumb canvas { max-width:100%; max-height:100%; }
    .fig-card .thumb canvas:not([style]) { width:0; height:0; }
    .fig-card span { font-size:11px; color:var(--ink2); line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .fig-card em { font-style:normal; color:var(--mute); }
    .term-row { display:flex; flex-direction:column; gap:1px; padding:4px 6px; border-radius:7px; }
    .term-row:hover { background:var(--hover); }
    .term-row .head { display:flex; width:100%; gap:6px; align-items:baseline; }
    .term-row .head strong { font-weight:500; flex:1; color:var(--ink); }
    .term-row .cnt { color:var(--mute); font-size:11px; }
    .term-row .head button { color:var(--mute); opacity:0; }
    .term-row:hover .head button { opacity:1; }
    .term-row input { font-size:12px; padding:2px 0; background:none; border-radius:0; border:0; border-bottom:1px solid transparent; color:var(--ink2); }
    .term-row input:focus { border-bottom-color:var(--accent); background:none; }
    .ask-paper { margin-top:8px; display:grid; gap:6px; }

    /* Reading area */
    .read { position:relative; overflow:auto; min-height:0; scrollbar-width:thin; }
    #pages { padding:24px 0 100px; }
    .page-wrap { position:relative; margin:0 auto 20px; display:flex; gap:30px; justify-content:center; }
    .page { position:relative; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.06); flex-shrink:0; border-radius:2px; }
    .page canvas { display:block; filter:var(--page-filter); border-radius:2px; }
    .pnum { position:absolute; left:-34px; top:4px; font-size:11px; color:var(--mute); font-variant-numeric:tabular-nums; }
    .hl-layer, .text-layer, .dot-layer { position:absolute; inset:0; }
    .hl-layer div { position:absolute; background:var(--mark); mix-blend-mode:multiply; border-radius:2px; transition:box-shadow .15s; }
    .hl-layer div.ai { background:var(--ai-mark); }
    .hl-layer div.lit { box-shadow:0 0 0 2px var(--accent); }
    .text-layer { overflow:hidden; line-height:1; }
    .text-layer span { position:absolute; color:transparent; white-space:pre; transform-origin:0 0; cursor:text; font-family:sans-serif; line-height:1; }
    .text-layer span::selection { background:rgba(53,89,199,.26); }
    .text-layer span.term { text-decoration:underline dotted #3559c7; text-decoration-thickness:2px; text-underline-offset:2px; }
    .text-layer span.ref { cursor:pointer; background:rgba(53,89,199,.1); border-radius:2px; text-decoration:underline #3559c7; text-decoration-thickness:1.5px; text-underline-offset:2px; }
    .text-layer span.ref:hover { background:rgba(53,89,199,.2); }
    .dot-layer { pointer-events:none; display:none; }
    .dot-layer button { pointer-events:auto; position:absolute; right:-8px; width:15px; height:15px; border-radius:50%; background:var(--accent); border:2px solid var(--card); box-shadow:var(--shadow-sm); }
    .dot-layer button.dot-note { background:var(--note-bar); }
    .margin { position:relative; width:290px; flex-shrink:0; }
    body:not(.has-margin) .margin { display:none; }
    body:not(.has-margin) .dot-layer { display:block; }
    body[data-pass=recap] .margin, body[data-pass=recap] .dot-layer, body[data-pass=recap] .hl-layer { display:none; }
    body[data-pass=recap] .page { opacity:.62; transition:opacity .2s; }
    body[data-pass=recap] .page:hover { opacity:1; }

    /* Margin notes */
    .note { position:absolute; left:0; width:100%; background:var(--card); border-radius:9px; padding:9px 12px 8px; font-size:12.5px; line-height:1.6; color:var(--ink2); box-shadow:var(--shadow-sm); border-left:3px solid var(--note-bar); transition:box-shadow .15s; }
    .note:hover { box-shadow:var(--shadow-pop); z-index:2; }
    .margin .note::before { content:""; position:absolute; left:-33px; top:16px; width:30px; height:1px; background:var(--line); }
    .note.ai { border-left-color:var(--accent); }
    .note.highlight { border-left-color:#f0d26a; }
    .note small { display:block; font-size:10.5px; color:var(--mute); letter-spacing:.01em; }
    .note .quote { font-size:11.5px; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin:1px 0 4px; font-style:italic; }
    .note .text { white-space:pre-wrap; word-break:break-word; color:var(--ink); }
    .note .text.clamp { max-height:9.6em; overflow:hidden; -webkit-mask-image:linear-gradient(#000 70%, transparent); mask-image:linear-gradient(#000 70%, transparent); }
    .note .text strong { font-weight:600; }
    .note .text code { font-size:11.5px; background:var(--field); padding:0 4px; border-radius:4px; }
    .note .acts { display:flex; gap:12px; margin-top:5px; font-size:11px; opacity:.0; transition:opacity .15s; }
    .note:hover .acts, .note:focus-within .acts, #notePop .note .acts { opacity:1; }
    .note .acts button { color:var(--mute); }
    .note .acts button:hover { color:var(--ink); }
    .note textarea { margin-top:4px; font-size:12.5px; }

    .pager { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:5; display:flex; align-items:center; gap:2px; background:var(--card); border-radius:999px; padding:4px 8px; box-shadow:var(--shadow-pop); font-size:12.5px; white-space:nowrap; color:var(--ink2); font-variant-numeric:tabular-nums; }
    /* Centre the pager over the reading column, not the whole window. */
    body[data-pass=skeleton] .pager, body[data-pass=read] .pager { left:calc(248px + (100vw - 248px) / 2); }
    body[data-pass=recap] .pager { left:calc((100vw - 480px) / 2); }
    .pager button { padding:4px 9px; border-radius:999px; }
    .pager button:hover { background:var(--hover); color:var(--ink); }
    .pager .sep { width:1px; height:16px; background:var(--line); margin:0 4px; }

    /* Recap panel */
    .recap { display:none; background:var(--card); border-left:1px solid var(--hair); overflow:auto; padding:26px 28px 48px; }
    body[data-pass=recap] .recap { display:block; }
    .recap h3 { margin:0 0 4px; font-size:17px; font-weight:600; }
    .recap .q { margin-top:18px; }
    .recap .q label { display:block; font-size:12px; color:var(--mute); margin-bottom:6px; }
    .recap .q textarea { font-size:14px; line-height:1.6; min-height:76px; }
    .fb { font-size:12.5px; margin-top:7px; line-height:1.6; }
    .fb:empty { display:none; }
    .fb.ok { color:var(--ok); } .fb.missing { color:var(--warn); } .fb.wrong { color:var(--bad); }
    .fb .quiet { margin-top:4px; padding:6px 10px; border-radius:8px; background:var(--field); color:var(--ink2); font-size:12.5px; }
    .card { margin-top:28px; border:1px solid var(--line); border-radius:12px; padding:16px 18px; }
    .card h4 { margin:0 0 4px; font-size:14px; font-weight:600; }
    .card label { display:block; font-size:12px; color:var(--mute); margin:12px 0 4px; }
    .row { display:flex; gap:6px; flex-wrap:wrap; margin-top:12px; align-items:center; }
    #mdOut { white-space:pre-wrap; font-size:11.5px; background:var(--field); border-radius:8px; padding:10px; margin-top:12px; max-height:260px; overflow:auto; }
    #mdOut:empty { display:none; }

    /* Popovers */
    .pop { position:fixed; z-index:30; background:var(--card); border-radius:12px; box-shadow:var(--shadow-pop); font-size:12.5px; color:var(--ink2); display:none; animation:pop-in .12s ease-out; }
    @keyframes pop-in { from { opacity:0; transform:translateY(-3px); } }
    #selPop { width:440px; max-width:calc(100vw - 24px); padding:10px 12px 12px; }
    #selQuote { font-size:11.5px; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-style:italic; }
    #selPop .acts { display:flex; gap:4px; margin-top:8px; flex-wrap:wrap; }
    #selPop .acts button { padding:5px 11px; border-radius:7px; background:var(--field); color:var(--ink2); transition:background .12s; }
    #selPop .acts button:hover { background:var(--accent-soft); color:var(--accent); }
    #selBody { margin-top:10px; padding-top:10px; border-top:1px solid var(--hair); color:var(--ink); font-size:13.5px; line-height:1.65; white-space:pre-wrap; }
    #selBody:empty { display:none; }
    #selBody textarea, #selBody input { margin-bottom:8px; font-size:13px; }
    #selBody .row { margin-top:8px; }
    #termPop { width:290px; padding:12px 14px; line-height:1.6; }
    #termPop strong { color:var(--ink); font-size:13.5px; font-weight:600; }
    #termPop .quiet { margin-bottom:4px; }
    #figPop { width:460px; max-width:calc(100vw - 24px); padding:10px; }
    #figPop canvas { display:block; max-width:100%; border-radius:8px; background:#fff; margin:0 auto; }
    #figCaption { font-size:12px; margin:8px 4px 2px; line-height:1.5; }
    #figPop .row { margin:4px 4px 0; }
    #notePop { width:300px; padding:0; }
    #notePop .note { position:static; box-shadow:none; }
    .settings { position:fixed; z-index:31; right:12px; top:54px; width:330px; background:var(--card); border-radius:12px; box-shadow:var(--shadow-pop); padding:14px 16px 16px; display:none; animation:pop-in .12s ease-out; }
    .settings.is-on { display:block; }
    .settings label { display:block; font-size:12px; color:var(--mute); margin:10px 0 4px; }
    .settings label:first-child { margin-top:0; }

    /* Paper list drawer */
    .scrim { position:fixed; inset:0; background:rgba(0,0,0,.22); z-index:20; display:none; }
    .drawer { position:fixed; z-index:21; left:0; top:0; bottom:0; width:350px; max-width:88vw; background:var(--card); padding:18px 16px; display:flex; flex-direction:column; gap:10px; transform:translateX(-105%); transition:transform .22s ease; overflow:auto; box-shadow:var(--shadow-pop); }
    .drawer > strong { font-size:15px; }
    body.lib-open .scrim { display:block; }
    body.lib-open .drawer { transform:none; }
    .add { display:flex; gap:6px; }
    .lib-item { display:grid; gap:1px; padding:9px 10px; border-radius:9px; cursor:pointer; }
    .lib-item:hover { background:var(--hover); }
    .lib-item.is-on { background:var(--accent-soft); }
    .lib-item strong { font-weight:500; font-size:13px; line-height:1.4; }
    .lib-item .link-del { justify-self:start; color:var(--mute); font-size:11.5px; opacity:0; }
    .lib-item:hover .link-del { opacity:1; }
    .toast { position:fixed; z-index:40; left:50%; top:60px; transform:translateX(-50%); background:var(--ink); color:var(--bg); border-radius:999px; padding:8px 16px; font-size:12.5px; display:none; box-shadow:var(--shadow-pop); }

    @media (max-width: 900px) {
      .top { gap:8px; padding:0 8px; }
      .brand, #openSource { display:none; }
      #railToggle { display:inline-block; }
      #cardBtn { display:none; }
      #paperTitle { flex:1; }
      .passes { margin:0; }
      .passes button { padding:5px 8px; }
      .passes button span { display:none; }
      .body, body[data-pass=recap] .body { grid-template-columns:minmax(0,1fr); }
      .rail { position:fixed; z-index:21; left:0; top:50px; bottom:0; width:280px; transform:translateX(-105%); transition:transform .2s ease; box-shadow:var(--shadow-pop); }
      body.rail-open .rail { transform:none; }
      body[data-pass=recap] .recap { position:fixed; inset:50px 0 0 0; z-index:15; padding:20px 16px 48px; }
      .pnum { display:none; }
      #pages { padding-top:14px; }
      body[data-pass] .pager { left:50%; }
    }
  </style>
</head>
<body data-pass="skeleton">
  <div class="app">
    <header class="top">
      <button class="btn" id="railToggle" aria-label="目录">☰</button>
      <span class="brand">Noesis</span>
      <h1 id="paperTitle" contenteditable="true" spellcheck="false" title="点一下可以改标题"></h1>
      <nav class="passes" aria-label="阅读阶段">
        <button data-pass="skeleton"><b>1</b><span>骨架</span></button>
        <button data-pass="read"><b>2</b><span id="readLabel">精读</span></button>
        <button data-pass="recap"><b>3</b><span>复述</span></button>
      </nav>
      <div class="tools">
        <a id="openSource" target="_blank" rel="noreferrer">原文 ↗</a>
        <button class="btn" id="libToggle" aria-expanded="false" aria-controls="libDrawer">论文 ▾</button>
        <button class="btn" id="settingsToggle" aria-label="设置">⚙︎</button>
        <button class="btn dark" id="cardBtn">能聊卡</button>
      </div>
    </header>

    <div class="body">
      <aside class="rail" id="rail">
        <section class="rail-skel">
          <h4>第一遍 · 看骨架（约 10 分钟）</h4>
          <p class="quiet" style="margin:0 4px 6px">先不逐句读。看完下面三样，能说出这篇在解决什么问题就够了。</p>
          <label class="step"><input type="checkbox" data-check="abstract"><span><button class="link" data-jump="abstract">读标题和摘要</button></span></label>
          <label class="step"><input type="checkbox" data-check="figures"><span>看所有图和图注</span></label>
          <div class="skel-figs" id="skelFigs"></div>
          <label class="step"><input type="checkbox" data-check="conclusion"><span><button class="link" data-jump="conclusion">读结论</button></span></label>
          <h4>一句话：这篇在解决什么问题？</h4>
          <textarea id="skelAnswer" rows="3" placeholder="用自己的话写，中文就行"></textarea>
          <div class="row"><button class="btn dark" id="skelDone">完成第一遍，开始精读</button></div>
        </section>

        <section class="rail-read">
          <h4>目录 <span id="tocProgress"></span></h4>
          <div id="toc"><p class="quiet">正在读取目录…</p></div>

  <script>
    const PDF_JS_URL = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.mjs";
    const PDF_WORKER_URL = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.mjs";
    const LIB_KEY = "noesis.reader.v2.library";
    const CURRENT_KEY = "noesis.reader.v2.current";
    const KEY_KEY = "noesis.paperCompanion.v1.openaiKey";
    const MODEL_KEY = "noesis.reader.v2.model";
    const VAULT_KEY = "noesis.reader.v4.vault";
    const PROVIDER_KEY = "noesis.reader.v4.provider";
    const BASE_KEY = "noesis.reader.v4.baseUrl";
    const PROVIDERS = {
      deepseek: { base: "https://api.deepseek.com", model: "deepseek-chat" },
      openai: { base: "https://api.openai.com/v1", model: "gpt-5.2-mini" },
      custom: { base: "", model: "" }
    };
    const FOLDER_KEY = "noesis.reader.v4.folder";
    const stateKey = (id) => `noesis.reader.v4.paper.${id}`;
    const oldNotesKey = (id) => `noesis.reader.v2.notes.${id}`;
    const oldTermsKey = (id) => `noesis.reader.v2.terms.${id}`;
    const SAMPLE = { id: "arxiv-2403.15176", source: "url", pdfUrl: "https://arxiv.org/pdf/2403.15176",
      title: "Brain-aligning of semantic vectors improves neural decoding of visual stimuli",
      meta: "arXiv 2403.15176 · 示例论文", link: "https://arxiv.org/abs/2403.15176" };

    const $ = (id) => document.getElementById(id);
    const read = $("read");
    const pagesBox = $("pages");

    let pdfjsLib = null;
    let pdfDoc = null;
    let paper = null;
    let state = null;
    let loadToken = 0;
    let scale = 1;
    let userZoomed = false;
    let currentPage = 1;
    let pageInfo = [];             // per page: { w, h, transform } at scale 1
    const textCache = new Map();   // page -> pdf.js text items
    let lines = new Map();         // page -> text lines (scale-1 coordinates)
    let headings = [];             // { title, page, top, level }
    let figures = new Map();       // "figure3" / "table1" -> { kind, num, page, top, caption }
    let bodySize = 10;
    const rendered = new Map();    // page -> scale it was drawn at
    const renderTasks = new Map();
    let observer = null;
    let pending = null;            // the selection the popover acts on
    let termRegex = null;

    // ---------- small helpers ----------
    function readJson(key, fallback) {
      try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; }
    }
    function writeJson(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch { showToast("浏览器存储已满或不可用，这次的修改没有保存。"); }
    }
    function showToast(text) {
      const t = $("toast");
      t.textContent = text; t.style.display = "block";
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => { t.style.display = "none"; }, 2800);
    }
    async function copyText(text, done = "已复制。") {
      try { await navigator.clipboard.writeText(text); showToast(done); return true; }
      catch { $("mdOut").textContent = text; showToast("无法自动复制，已放到能聊卡下面，可以手动复制。"); return false; }
    }
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const escRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    function cleanSelection(text) {
      return text.replace(/(\w)-\s+(\w)/g, "$1$2").replace(/\s+/g, " ").trim();
    }
    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      return e;
    }
    function placePop(pop, rect, width) {
      pop.style.display = "block";
      const w = pop.offsetWidth || width || 300, h = pop.offsetHeight || 120;
      let left = Math.min(Math.max(12, rect.left), window.innerWidth - w - 12);
      let top = rect.bottom + 8;
      if (top + h > window.innerHeight - 12) top = Math.max(12, rect.top - h - 8);
      pop.style.left = `${left}px`; pop.style.top = `${top}px`;
    }
    function hidePops() { ["selPop", "termPop", "figPop", "notePop"].forEach((id) => { $(id).style.display = "none"; }); }

    // ---------- per-paper state ----------
    function blankState() {
      return { pass: "skeleton", skeleton: { answer: "", checks: {} }, sectionsDone: [], annotations: [], terms: [],
        recap: { q1: "", q2: "", q3: "" }, feedback: {}, card: { one: "", method: "", limit: "", ask: "" } };
    }
    // Version 2 kept five note lines and plain term cards; carry them over without deleting the old copies.
    function loadState(id) {
      const saved = readJson(stateKey(id), null);
      if (saved) return { ...blankState(), ...saved };
      const s = blankState();
      const notes = readJson(oldNotesKey(id), null);
      if (notes) {
        s.skeleton.answer = notes.oneLine || "";
        const rest = [["最有用的点", notes.useful], ["没懂的地方", notes.confused], ["和我关心的问题", notes.myInterest], ["想问作者", notes.authorQuestion]]
          .filter(([, v]) => v && v.trim()).map(([k, v]) => `${k}：${v.trim()}`).join("\n");
        if (rest) s.annotations.push({ id: uid(), kind: "note", page: 1, rects: [], y: 0, quote: "", text: `旧版笔记\n${rest}`, created: new Date().toISOString() });
      }
      readJson(oldTermsKey(id), []).forEach((t) => { if (t.text) s.terms.push({ id: uid(), term: t.text.slice(0, 80), meaning: "", created: t.created || new Date().toISOString() }); });
      return s;
    }
    function save() { if (paper && state) writeJson(stateKey(paper.id), state); }

    // ---------- library ----------
    function library() { return readJson(LIB_KEY, []); }
    function saveLibrary(list) { writeJson(LIB_KEY, list); }
    function updatePaper(changes) {
      if (!paper) return;
      Object.assign(paper, changes);
      saveLibrary(library().map((p) => p.id === paper.id ? { ...p, ...changes } : p));
      renderLibrary();
    }
    function idb() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open("noesis-reader", 1);
        req.onupgradeneeded = () => req.result.createObjectStore("pdfs");
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    async function idbPut(id, bytes) {
      const db = await idb();
      await new Promise((res, rej) => { const tx = db.transaction("pdfs", "readwrite"); tx.objectStore("pdfs").put(bytes, id); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
    }
    async function idbGet(id) {
      const db = await idb();
      return new Promise((res, rej) => { const r = db.transaction("pdfs").objectStore("pdfs").get(id); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    }
    async function idbDelete(id) { try { const db = await idb(); db.transaction("pdfs", "readwrite").objectStore("pdfs").delete(id); } catch {} }

    function parseSource(raw) {
      const text = raw.trim();
      const arxiv = text.match(/^(?:arxiv:)?(\d{4}\.\d{4,5})(v\d+)?$/i) || text.match(/arxiv\.org\/(?:abs|pdf)\/(\d{4}\.\d{4,5})(v\d+)?/i);
      if (arxiv) {
        const id = arxiv[1] + (arxiv[2] || "");
        return { id: `arxiv-${id}`, source: "url", pdfUrl: `https://arxiv.org/pdf/${id}`, link: `https://arxiv.org/abs/${id}`, meta: `arXiv ${id}`, title: "" };
      }
      if (/^https?:\/\//i.test(text)) return { id: `url-${Date.now().toString(36)}`, source: "url", pdfUrl: text, link: text, meta: new URL(text).hostname, title: "" };
      return null;
    }
    function addPaper(entry) {
      const list = library();
      const existing = list.find((p) => p.id === entry.id);
      if (!existing) { list.unshift({ ...entry, addedAt: new Date().toISOString() }); saveLibrary(list); }
      openPaper(existing ? existing.id : entry.id);
    }
    function removePaper(id) {
      if (!confirm("从列表里删除这篇论文，并清空它的批注、术语和复述？")) return;
      const list = library().filter((p) => p.id !== id);
      saveLibrary(list);
      [stateKey(id), oldNotesKey(id), oldTermsKey(id)].forEach((k) => localStorage.removeItem(k));
      idbDelete(id);
      if (paper?.id === id) { paper = null; if (list[0]) openPaper(list[0].id); else showEmpty(); }
      renderLibrary();
    }
    function renderLibrary() {
      const box = $("library");
      box.innerHTML = "";
      const list = library();
      if (!list.length) { box.append(el("p", "quiet", "还没有论文。在上面输入 arXiv 编号、PDF 链接，或上传 PDF。")); return; }
      list.forEach((p) => {
        const item = el("div", `lib-item${paper?.id === p.id ? " is-on" : ""}`);
        item.tabIndex = 0;
        const del = el("button", "link-del", "删除");
        del.addEventListener("click", (e) => { e.stopPropagation(); removePaper(p.id); });
        item.append(el("strong", "", p.title || "（正在读取标题…）"), el("span", "quiet", p.meta || ""), del);
        item.addEventListener("click", () => openPaper(p.id));
        item.addEventListener("keydown", (e) => { if (e.key === "Enter") openPaper(p.id); });
        box.append(item);
      });
    }
    function openLibrary(focusAdd = false) {
      document.body.classList.add("lib-open");
      $("libToggle").setAttribute("aria-expanded", "true");
      if (focusAdd) setTimeout(() => $("addInput").focus(), 60);
    }
    function closeLibrary() {
      document.body.classList.remove("lib-open", "rail-open");
      $("libToggle").setAttribute("aria-expanded", "false");
    }

    function showEmpty() {
      $("paperTitle").textContent = "添加一篇论文开始阅读";
      pdfDoc = null; pagesBox.innerHTML = ""; state = blankState();
      $("pageCounter").textContent = "未加载";
      renderAll();
    }

    async function openPaper(id) {
      const p = library().find((x) => x.id === id);
      if (!p) return;
      paper = { ...p };
      state = loadState(id);
      localStorage.setItem(CURRENT_KEY, id);
      closeLibrary(); hidePops();
      $("paperTitle").textContent = p.title || "正在读取标题…";
      const open = $("openSource");
      if (p.link) { open.href = p.link; open.style.display = ""; } else open.style.display = "none";
      renderLibrary();
      restoreFields();
      setPass(state.pass, false);
      buildTermRegex();
      if (p.source === "upload") {
        const bytes = await idbGet(id).catch(() => null);
        if (!bytes) { showToast("这篇上传的 PDF 不在这台设备上了，请重新上传。"); return; }
        await loadPdf({ data: new Uint8Array(bytes) });
      } else {
        await loadPdf({ url: p.pdfUrl });
      }
    }

    // ---------- PDF loading and page layout ----------
    async function ensurePdfJs() {
      if (pdfjsLib) return pdfjsLib;
      $("pageCounter").textContent = "加载 PDF.js…";
      pdfjsLib = await import(PDF_JS_URL);
      pdfjsLib.GlobalWorkerOptions.workerSrc = PDF_WORKER_URL;
      return pdfjsLib;
    }

    async function loadPdf(source) {
      const token = ++loadToken;
      try {
        const lib = await ensurePdfJs();
        $("pageCounter").textContent = "加载 PDF…";
        const doc = await lib.getDocument(source).promise;
        if (token !== loadToken) return;
        const info = [];
        for (let n = 1; n <= doc.numPages; n++) {
          const vp = (await doc.getPage(n)).getViewport({ scale: 1 });
          info[n] = { w: vp.width, h: vp.height, transform: vp.transform };
        }
        if (token !== loadToken) return;
        pdfDoc = doc; pageInfo = info;
        textCache.clear(); rendered.clear(); renderTasks.clear();
        lines = new Map(); headings = []; figures = new Map(); figPageCache.clear(); thumbCache.clear();
        currentPage = 1;
        userZoomed = false;
        buildPages();
        renderAll();
        if (paper && !paper.title) {
          const title = await guessTitle(doc);
          if (token === loadToken && title) { updatePaper({ title }); $("paperTitle").textContent = title; }
          else if (token === loadToken) $("paperTitle").textContent = "（没读到标题，点这里手动填写）";
        }
        await analyzePaper(token);
      } catch (error) {
        if (token !== loadToken) return;
        console.error(error);
        $("pageCounter").textContent = "加载失败";
        showToast("PDF 加载失败。有的网站不允许网页直接读取，可以先下载，再用“上传 PDF”。");
      }
    }

    function wrapOf(n) { return pagesBox.querySelector(`.page-wrap[data-page="${n}"]`); }

    function buildPages() {
      pagesBox.innerHTML = "";
      observer?.disconnect();
      for (let n = 1; n <= pdfDoc.numPages; n++) {
        const wrap = el("div", "page-wrap"); wrap.dataset.page = n;
        const page = el("div", "page");
        page.append(el("span", "pnum", String(n)), document.createElement("canvas"), el("div", "hl-layer"), el("div", "text-layer"), el("div", "dot-layer"));
        wrap.append(page, el("div", "margin"));
        pagesBox.append(wrap);
      }
      observer = new IntersectionObserver((entries) => {
        entries.forEach((e) => { const n = Number(e.target.dataset.page); if (e.isIntersecting) renderPage(n); else unrenderPage(n); });
      }, { root: read, rootMargin: "1200px 0px" });
      applyScale();
      $("pageCounter").textContent = `1 / ${pdfDoc.numPages}`;
    }

    // Fit the widest page to the reading column unless the reader zoomed.
    function applyScale() {
      if (!pdfDoc || pagesBox.children.length !== pdfDoc.numPages) return;
      const wide = read.clientWidth >= 900 && state.pass !== "recap";
      document.body.classList.toggle("has-margin", wide);
      if (!userZoomed) {
        const maxW = Math.max(...pageInfo.slice(1).map((p) => p.w));
        const room = read.clientWidth - (wide ? 290 + 28 + 56 : 28);
        scale = Math.max(.5, Math.min(1.6, room / maxW));
      }
      const keep = currentPage;
      rendered.clear();
      for (let n = 1; n <= pdfDoc.numPages; n++) {
        const page = wrapOf(n).querySelector(".page");
        page.style.width = `${Math.floor(pageInfo[n].w * scale)}px`;
        page.style.height = `${Math.floor(pageInfo[n].h * scale)}px`;
        renderMargin(n);
      }
      $("zoomLabel").textContent = `${Math.round(scale * 100)}%`;
      observer.disconnect();
      pagesBox.querySelectorAll(".page-wrap").forEach((w) => observer.observe(w));
      scrollToPos(keep, 0, false);
    }

    async function renderPage(n) {
      if (!pdfDoc || rendered.get(n) === scale) return;
      const wrap = wrapOf(n); if (!wrap) return;
      const drawScale = scale;
      renderTasks.get(n)?.cancel();
      const page = await pdfDoc.getPage(n);
      const viewport = page.getViewport({ scale: drawScale });
      const canvas = wrap.querySelector("canvas");
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.floor(viewport.width * dpr);
      canvas.height = Math.floor(viewport.height * dpr);
      canvas.style.width = `${Math.floor(viewport.width)}px`;
      canvas.style.height = `${Math.floor(viewport.height)}px`;
      const task = page.render({ canvasContext: canvas.getContext("2d"), viewport, transform: dpr === 1 ? null : [dpr, 0, 0, dpr, 0, 0] });
      renderTasks.set(n, task);
      try { await task.promise; } catch { return; }
      if (drawScale !== scale) return;
      rendered.set(n, drawScale);
      await buildTextLayer(n);
      drawHighlights(n);
    }

    function unrenderPage(n) {
      renderTasks.get(n)?.cancel();
      const wrap = wrapOf(n); if (!wrap) return;
      const canvas = wrap.querySelector("canvas"); canvas.width = canvas.height = 0;
      wrap.querySelector(".text-layer").innerHTML = "";
      wrap.querySelector(".hl-layer").innerHTML = "";
      rendered.delete(n);
    }

    async function getText(n) {
      if (!textCache.has(n)) textCache.set(n, (await (await pdfDoc.getPage(n)).getTextContent()).items);
      return textCache.get(n);
    }

    // ---------- text layer: selectable text, term underlines, clickable figure references ----------
    const measureCtx = document.createElement("canvas").getContext("2d");
    const REF_RE = /\b(Fig(?:ure)?s?\.?|Table)\s*(\d+)/gi;

    function buildTermRegex() {
      const list = (state?.terms || []).map((t) => t.term.trim()).filter((t) => t.length > 1).sort((a, b) => b.length - a.length);
      termRegex = list.length ? new RegExp(`\\b(?:${list.map(escRe).join("|")})(?:s|es)?\\b`, "gi") : null;
    }
    function findTerm(word) {
      const w = word.toLowerCase();
      return state.terms.find((t) => { const k = t.term.toLowerCase(); return w === k || w === `${k}s` || w === `${k}es`; });
    }
    function isCaptionLine(n, top) {
      for (const f of figures.values()) if (f.page === n && Math.abs(f.top - top) < 3) return true;
      return false;
    }

    async function buildTextLayer(n) {
      const wrap = wrapOf(n); if (!wrap || !pdfjsLib) return;
      const items = await getText(n);
      const layer = wrap.querySelector(".text-layer");
      layer.innerHTML = "";
      const vt = pdfjsLib.Util.transform([scale, 0, 0, scale, 0, 0], pageInfo[n].transform);
      items.forEach((item) => {
        if (!item.str.trim()) { if (item.hasEOL) layer.append(document.createElement("br")); return; }
        // pdf.js gives the baseline; boxes start at the top of the glyphs.
        const tx = pdfjsLib.Util.transform(vt, item.transform);
        const angle = Math.atan2(tx[1], tx[0]);
        const fontHeight = Math.hypot(tx[2], tx[3]);
        const ascent = fontHeight * 0.8;
        const left = tx[4] + ascent * Math.sin(angle);
        const top = tx[5] - ascent * Math.cos(angle);
        measureCtx.font = `${fontHeight}px sans-serif`;
        const natural = measureCtx.measureText(item.str).width;
        const target = (item.dir === "ttb" ? item.height : item.width) * scale;
        const scaleX = natural > 0 && target > 0 ? target / natural : 1;
        // Split the line where a saved term or a "Figure 3" reference sits, so each can be styled on its own.
        const marks = angle ? [] : findMarks(item.str, n, top / scale);
        let cursor = 0;
        const pieces = [];
        marks.forEach((m) => { if (m.s > cursor) pieces.push({ s: cursor, e: m.s }); pieces.push(m); cursor = m.e; });
        if (cursor < item.str.length) pieces.push({ s: cursor, e: item.str.length });
        pieces.forEach((p) => {
          const span = el("span", p.cls || "", item.str.slice(p.s, p.e));
          const dx = p.s ? measureCtx.measureText(item.str.slice(0, p.s)).width * scaleX : 0;
          span.style.fontSize = `${fontHeight}px`;
          span.style.left = `${left + dx}px`;
          span.style.top = `${top}px`;
          span.style.transform = `${angle ? `rotate(${angle}rad) ` : ""}scaleX(${scaleX})`;
          if (p.cls === "term") span.dataset.term = p.key;
          if (p.cls === "ref") { span.dataset.kind = p.kind; span.dataset.num = p.num; }
          layer.append(span);
        });
        if (item.hasEOL) layer.append(document.createElement("br"));
      });
    }

    function findMarks(str, n, top) {
      const marks = [];
      if (termRegex) for (const m of str.matchAll(termRegex)) marks.push({ s: m.index, e: m.index + m[0].length, cls: "term", key: m[0] });
      if (!isCaptionLine(n, top)) {
        for (const m of str.matchAll(REF_RE)) {
          const s = m.index, e = s + m[0].length;
          if (marks.some((k) => s < k.e && e > k.s)) continue;
          marks.push({ s, e, cls: "ref", kind: /^tab/i.test(m[1]) ? "table" : "figure", num: m[2] });
        }
      }
      return marks.sort((a, b) => a.s - b.s);
    }

    async function rebuildTextLayers() { for (const n of rendered.keys()) await buildTextLayer(n); }

    // ---------- reading the paper's structure: lines, headings, figure captions ----------
    async function analyzePaper(token) {
      for (let n = 1; n <= pdfDoc.numPages; n++) {
        const items = await getText(n);
        if (token !== loadToken) return;
        lines.set(n, groupLines(n, items));
      }
      const sizes = new Map();
      lines.forEach((ls) => ls.forEach((l) => { const k = Math.round(l.size * 2) / 2; sizes.set(k, (sizes.get(k) || 0) + l.text.length); }));
      bodySize = [...sizes.entries()].sort((a, b) => b[1] - a[1])[0]?.[0] || 10;
      headings = await outlineHeadings();
      if (headings.length < 3) headings = textHeadings();
      figures = findFigures();
      renderAll();
      await rebuildTextLayers();
    }

    function groupLines(n, items) {
      const vt = pageInfo[n].transform;
      const rows = new Map();
      items.forEach((i) => {
        if (!i.str.trim() || Math.abs(i.transform[1]) > 0.01 || Math.abs(i.transform[2]) > 0.01) return;
        const tx = pdfjsLib.Util.transform(vt, i.transform);
        const size = Math.hypot(tx[2], tx[3]);
        const key = Math.round(tx[5] / 2);
        if (!rows.has(key)) rows.set(key, []);
        rows.get(key).push({ str: i.str, x: tx[4], w: i.width, size, base: tx[5] });
      });
      return [...rows.values()].map((row) => {
        row.sort((a, b) => a.x - b.x);
        const size = Math.max(...row.map((r) => r.size));
        const text = row.reduce((t, r, k) => {
          if (!k) return r.str;
          const prev = row[k - 1];
          return t + (r.x - (prev.x + prev.w) > r.size * 0.12 && !t.endsWith(" ") && !r.str.startsWith(" ") ? " " : "") + r.str;
        }, "").replace(/\s+/g, " ").trim();
        const base = Math.max(...row.map((r) => r.base));
        return { text, size, top: base - size * 0.8, x: row[0].x, width: row[row.length - 1].x + row[row.length - 1].w - row[0].x };
      }).sort((a, b) => a.top - b.top);
    }

    async function outlineHeadings() {
      try {
        const outline = await pdfDoc.getOutline();
        if (!outline?.length) return [];
        const out = [];
        const walk = async (items, level) => {
          for (const it of items) {
            let dest = it.dest;
            if (typeof dest === "string") dest = await pdfDoc.getDestination(dest);
            if (Array.isArray(dest) && dest[0]) {
              const page = (await pdfDoc.getPageIndex(dest[0])) + 1;
              const y = dest[1]?.name === "XYZ" && typeof dest[3] === "number" ? pageInfo[page].h - dest[3] : 0;
              out.push({ title: it.title.trim(), page, top: Math.max(0, y), level });
            }
            if (level < 2 && it.items?.length) await walk(it.items, level + 1);
          }
        };
        await walk(outline, 1);
        return out;
      } catch { return []; }
    }

    const NAMED = /^(?:(?:\d{1,2}|[IVX]{1,4})\.?\s+)?(abstract|summary|introduction|background|related work|methods?|materials and methods|methodology|experiments?|results(?: and discussion)?|discussion|conclusions?|limitations|references|acknowledge?ments?)\s*:?$/i;
    const NUMBERED = /^(\d{1,2}(?:\.\d{1,2}){0,2})\.?\s+([A-Z][^]{1,80})$/;
    function textHeadings() {
      const out = [];
      lines.forEach((ls, page) => ls.forEach((l) => {
        const named = l.text.match(NAMED);
        const numbered = !named && l.text.match(NUMBERED);
        if (named && l.size >= bodySize * 0.95) out.push({ title: l.text, page, top: l.top, level: 1 });
        else if (numbered && l.size >= bodySize * 0.98 && l.text.split(" ").length <= 12 && !/[.,;]$/.test(l.text) && Number(numbered[1].split(".")[0]) <= 20) {
          out.push({ title: l.text, page, top: l.top, level: numbered[1].includes(".") ? 2 : 1 });
        }
      }));
      return out.filter((h, i) => !i || h.title !== out[i - 1].title);
    }

    function findFigures() {
      const found = new Map();
      const strict = /^(fig(?:ure)?\.?|table)\s*(\d+)\s*[.:|]/i;
      const loose = /^(fig(?:ure)?\.?|table)\s*(\d+)\s+[A-Z(]/i;
      [strict, loose].forEach((re) => lines.forEach((ls, page) => ls.forEach((l, k) => {
        const m = l.text.match(re);
        if (!m) return;
        const kind = /^tab/i.test(m[1]) ? "table" : "figure";
        const key = `${kind}${m[2]}`;
        if (found.has(key)) return;
        const caption = `${l.text} ${ls[k + 1]?.text || ""}`.slice(0, 160);
        found.set(key, { kind, num: m[2], page, top: l.top, caption });
      })));
      return new Map([...found.entries()].sort((a, b) => a[1].kind.localeCompare(b[1].kind) || a[1].num - b[1].num));
    }

    function findHeading(re) { return headings.filter((h) => re.test(h.title)); }

    // ---------- scrolling ----------
    function scrollToPos(n, top, smooth = true) {
      const wrap = wrapOf(n); if (!wrap) return;
      read.scrollTo({ top: wrap.offsetTop + top * scale - 40, behavior: smooth ? "smooth" : "auto" });
    }
    let scrollQueued = false;
    read.addEventListener("scroll", () => {
      if (scrollQueued) return;
      scrollQueued = true;
      requestAnimationFrame(() => {
        scrollQueued = false;
        if (!pdfDoc) return;
        const line = read.scrollTop + read.clientHeight * 0.3;
        let n = 1;
        pagesBox.querySelectorAll(".page-wrap").forEach((w) => { if (w.offsetTop <= line) n = Number(w.dataset.page); });
        currentPage = n;
        $("pageCounter").textContent = `${n} / ${pdfDoc.numPages}`;
        markCurrentSection(line);
      });
    });
    function markCurrentSection(line) {
      let idx = -1;
      headings.forEach((h, i) => { const w = wrapOf(h.page); if (w && w.offsetTop + h.top * scale <= line + 10) idx = i; });
      document.querySelectorAll(".toc-row").forEach((r) => r.classList.toggle("here", Number(r.dataset.i) === idx));
    }

    // ---------- annotations: highlights on the page, cards in the margin ----------
    function anchorY(a) { return a.rects?.length ? Math.min(...a.rects.map((r) => r.y)) : (a.y || 0); }

    function drawHighlights(n) {
      const wrap = wrapOf(n); if (!wrap) return;
      const layer = wrap.querySelector(".hl-layer");
      layer.innerHTML = "";
      state.annotations.filter((a) => a.page === n).forEach((a) => a.rects.forEach((r) => {
        const d = el("div", a.kind === "ai" ? "ai" : "");
        d.dataset.id = a.id;
        Object.assign(d.style, { left: `${r.x * scale}px`, top: `${r.y * scale}px`, width: `${r.w * scale}px`, height: `${r.h * scale}px` });
        layer.append(d);
      }));
    }

    function noteCard(a) {
      const card = el("div", `note ${a.kind}`);
      card.dataset.id = a.id;
      const label = a.kind === "ai" ? `问 AI · ${a.question || ""}` : a.kind === "highlight" ? "高亮" : "我的批注";
      card.append(el("small", "", `${label} · p.${a.page}`));
      if (a.quote) card.append(el("div", "quote", a.quote));
      const acts = el("div", "acts");
      if (a.text) {
        const text = el("div", "text");
        text.innerHTML = mdLite(a.text);
        card.append(text);
        // Long answers fold to a few lines so the cards below stay near their own paragraphs.
        if (a.text.length > 140 || a.text.split("\n").length > 6) {
          text.classList.add("clamp");
          const more = el("button", "", "展开");
          more.addEventListener("click", () => {
            more.textContent = text.classList.toggle("clamp") ? "展开" : "收起";
            layoutMargin(a.page);
          });
          acts.append(more);
        }
      }
      const edit = el("button", "", a.text ? "编辑" : "写批注");
      edit.addEventListener("click", () => editNote(card, a));
      const del = el("button", "", "删除");
      del.addEventListener("click", () => deleteAnnotation(a.id));
      acts.append(edit, del);
      card.append(acts);
      card.addEventListener("mouseenter", () => lightUp(a.id, true));
      card.addEventListener("mouseleave", () => lightUp(a.id, false));
      return card;
    }
    function lightUp(id, on) { document.querySelectorAll(`.hl-layer div[data-id="${id}"]`).forEach((d) => d.classList.toggle("lit", on)); }

    function editNote(card, a) {
      const box = document.createElement("textarea");
      box.rows = 4; box.value = a.text || "";
      const old = card.querySelector(".text");
      if (old) old.replaceWith(box); else card.querySelector(".acts").before(box);
      box.focus();
      box.addEventListener("blur", () => {
        a.text = box.value.trim();
        if (a.kind === "highlight" && a.text) a.kind = "note";
        save(); renderMargin(a.page); drawHighlights(a.page);
        $("notePop").style.display = "none";
      });
    }

    function renderMargin(n) {
      const wrap = wrapOf(n); if (!wrap || !state) return;
      const margin = wrap.querySelector(".margin");
      const dots = wrap.querySelector(".dot-layer");
      margin.innerHTML = ""; dots.innerHTML = "";
      state.annotations.filter((a) => a.page === n).sort((a, b) => anchorY(a) - anchorY(b)).forEach((a) => {
        margin.append(noteCard(a));
        const dot = el("button", a.kind === "ai" ? "dot-ai" : "dot-note");
        dot.style.top = `${anchorY(a) * scale}px`;
        dot.setAttribute("aria-label", "看批注");
        dot.addEventListener("click", () => {
          const pop = $("notePop"); pop.innerHTML = ""; pop.append(noteCard(a)); placePop(pop, dot.getBoundingClientRect(), 300);
        });
        dots.append(dot);
      });
      layoutMargin(n);
    }
    // Each card sits level with its text, pushed down only as far as needed to clear the card above.
    function layoutMargin(n) {
      const margin = wrapOf(n)?.querySelector(".margin"); if (!margin) return;
      let bottom = 0;
      margin.querySelectorAll(".note").forEach((card) => {
        const a = state.annotations.find((x) => x.id === card.dataset.id);
        const top = Math.max(anchorY(a) * scale, bottom);
        card.style.top = `${top}px`;
        bottom = top + card.offsetHeight + 8;
      });
      margin.style.minHeight = `${bottom}px`;
    }

    // Just enough Markdown for AI answers: bold, inline code, headings. Text is escaped first.
    function mdLite(text) {
      return String(text)
        .replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" })[ch])
        .replace(/^#{1,6}\s+(.+)$/gm, "<strong>$1</strong>")
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/`([^`\n]+)`/g, "<code>$1</code>");
    }

    function addAnnotation(kind, text, extra = {}) {
      if (!pending) return null;
      const a = { id: uid(), kind, page: pending.page, rects: pending.rects, quote: pending.quote, text, ...extra, created: new Date().toISOString() };
      state.annotations.push(a);
      save(); drawHighlights(a.page); renderMargin(a.page);
      window.getSelection()?.removeAllRanges();
      return a;
    }
    function addPinned(text, extra) {
      const a = { id: uid(), kind: "ai", page: currentPage, rects: [], y: 0, quote: "", text, ...extra, created: new Date().toISOString() };
      state.annotations.push(a); save(); renderMargin(a.page);
      return a;
    }
    function deleteAnnotation(id) {
      const a = state.annotations.find((x) => x.id === id);
      if (!a || !confirm("删除这条？")) return;
      state.annotations = state.annotations.filter((x) => x.id !== id);
      save(); drawHighlights(a.page); renderMargin(a.page);
      $("notePop").style.display = "none";
    }

    // ---------- selection popover ----------
    function selectionInfo() {
      const sel = window.getSelection();
      if (!sel || sel.isCollapsed || !sel.rangeCount) return null;
      const range = sel.getRangeAt(0);
      const wrap = (range.startContainer.nodeType === 1 ? range.startContainer : range.startContainer.parentElement)?.closest(".page-wrap");
      if (!wrap) return null;
      const pageEl = wrap.querySelector(".page");
      const pr = pageEl.getBoundingClientRect();
      const raw = [...range.getClientRects()]
        .filter((r) => r.width > 1 && r.height > 1 && r.top >= pr.top - 2 && r.bottom <= pr.bottom + 2 && r.left >= pr.left - 2 && r.right <= pr.right + 2)
        .map((r) => ({ x: (r.left - pr.left) / scale, y: (r.top - pr.top) / scale, w: r.width / scale, h: r.height / scale }))
        .sort((a, b) => a.y - b.y || a.x - b.x);
      // One box per line.
      const rects = [];
      raw.forEach((r) => {
        const last = rects[rects.length - 1];
        if (last && Math.abs(last.y - r.y) < r.h * 0.5) {
          const x2 = Math.max(last.x + last.w, r.x + r.w); last.x = Math.min(last.x, r.x); last.w = x2 - last.x; last.h = Math.max(last.h, r.h);
        } else rects.push({ ...r });
      });
      const quote = cleanSelection(sel.toString()).slice(0, 2000);
      if (quote.length < 2) return null;
      return { page: Number(wrap.dataset.page), rects, quote, box: range.getBoundingClientRect() };
    }

    pagesBox.addEventListener("mouseup", (event) => {
      setTimeout(() => {
        const info = selectionInfo();
        if (!info) {
          const ref = event.target.closest?.(".ref");
          if (ref) showFigure(ref.dataset.kind, ref.dataset.num, ref.getBoundingClientRect());
          return;
        }
        pending = info;
        $("termPop").style.display = "none";
        $("selQuote").textContent = info.quote;
        $("selBody").innerHTML = "";
        placePop($("selPop"), info.box, 420);
      }, 0);
    });

    document.querySelectorAll("#selPop [data-act]").forEach((b) => b.addEventListener("click", () => selAction(b.dataset.act)));

    async function selAction(act) {
      if (!pending) return;
      const body = $("selBody");
      body.innerHTML = "";
      if (act === "highlight") { addAnnotation("highlight", ""); hidePops(); return; }
      if (act === "term") { addTerm(pending.quote); hidePops(); return; }
      if (act === "note") {
        const box = document.createElement("textarea"); box.rows = 3; box.placeholder = "写下你的理解或疑问";
        const ok = el("button", "btn dark", "保存");
        ok.addEventListener("click", () => { if (box.value.trim()) { addAnnotation("note", box.value.trim()); hidePops(); } });
        body.append(box, ok); box.focus();
        return;
      }
      if (act === "translate") {
        body.textContent = "翻译中…";
        const result = await machineTranslate(pending.quote);
        body.textContent = result.text;
        const row = el("div", "row");
        const keep = el("button", "btn", "存成批注");
        keep.addEventListener("click", () => { addAnnotation("note", `译：${result.main}`); hidePops(); });
        row.append(keep);
        if (apiKey()) {
          const better = el("button", "btn", "让 AI 翻得更准");
          better.addEventListener("click", () => askAboutSelection("把这段翻译成自然的中文，保留关键术语的英文，并简单解释难点。"));
          row.append(better);
        }
        body.append(row);
        return;
      }
      if (act === "ask") {
        const input = document.createElement("input"); input.placeholder = "问这段……（不填就是“解释这段”）";
        const ok = el("button", "btn dark", "问");
        const go = () => askAboutSelection(input.value.trim());
        ok.addEventListener("click", go);
        input.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
        body.append(input, ok); input.focus();
      }
    }

    async function askAboutSelection(question) {
      const q = question || "解释这段在说什么，写给刚接触这个领域的人";
      const pageText = await pageTextOf(pending.page);
      const prompt = `${q}

论文：${paper?.title || ""}
所在页：p.${pending.page}
选中的原文：
${pending.quote}

这一页的原文（供参考）：
${pageText.slice(0, 3500)}

要求：中文回答，关键术语保留英文；先用一两句话直接回答，再分点补充，全文不超过 250 字；只根据原文说话，原文没写的要说明是你的推测；结尾写“依据：p.页码”。`;
      const body = $("selBody");
      if (!apiKey()) {
        await copyText(prompt, "没填 AI key，prompt 已复制。");
        body.textContent = "没填 AI key：prompt 已复制，可以贴到任意 AI 聊天工具。拿到回答后，可以用“批注”把要点存在这里。";
        return;
      }
      body.textContent = "AI 思考中…";
      try {
        const answer = await callAi(prompt);
        addAnnotation("ai", answer, { question: question || "解释这段" });
        hidePops();
      } catch (e) {
        await copyText(prompt, "AI 请求失败，prompt 已复制。");
        body.textContent = `请求没有成功（${e.message.slice(0, 80)}）。prompt 已复制。`;
      }
    }

    // ---------- terms ----------
    async function addTerm(raw) {
      const term = cleanSelection(raw).replace(/^[^\w]+|[^\w)]+$/g, "").slice(0, 80);
      if (term.length < 2) return;
      if (state.terms.some((t) => t.term.toLowerCase() === term.toLowerCase())) { showToast("这个术语已经记过了。"); return; }
      const t = { id: uid(), term, meaning: "", created: new Date().toISOString() };
      state.terms.unshift(t);
      save(); buildTermRegex(); renderTerms(); await rebuildTextLayers();
      showToast(`已记成术语，全文 ${countTerm(term)} 处已标出。`);
      const result = await machineTranslate(term);
      if (!t.meaning && result.main) { t.meaning = result.main; save(); renderTerms(); }
    }
    function countTerm(term) {
      const re = new RegExp(`\\b${escRe(term)}(?:s|es)?\\b`, "gi");
      let c = 0;
      textCache.forEach((items) => { c += (items.map((i) => i.str).join(" ").match(re) || []).length; });
      return c;
    }
    function removeTerm(id) {
      state.terms = state.terms.filter((t) => t.id !== id);
      save(); buildTermRegex(); renderTerms(); rebuildTextLayers();
    }

    let termHideTimer = null;
    pagesBox.addEventListener("mouseover", (e) => {
      const span = e.target.closest?.(".term");
      if (!span || $("selPop").style.display === "block") return;
      const t = findTerm(span.dataset.term || span.textContent);
      if (!t) return;
      clearTimeout(termHideTimer);
      const pop = $("termPop");
      pop.innerHTML = "";
      pop.append(el("strong", "", t.term), el("div", "quiet", `全文 ${countTerm(t.term)} 处`), el("div", "", t.meaning || "还没写解释。在左边“我的术语”里点它补上。"));
      placePop(pop, span.getBoundingClientRect(), 280);
    });
    pagesBox.addEventListener("mouseout", (e) => {
      if (e.target.closest?.(".term")) termHideTimer = setTimeout(() => { $("termPop").style.display = "none"; }, 200);
    });

    // ---------- figures ----------
    const figPageCache = new Map();
    let figTarget = null;
    async function pageCanvas(n) {
      if (figPageCache.has(n)) return figPageCache.get(n);
      const page = await pdfDoc.getPage(n);
      const vp = page.getViewport({ scale: 2 });
      const c = document.createElement("canvas");
      c.width = vp.width; c.height = vp.height;
      await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
      if (figPageCache.size > 8) figPageCache.delete(figPageCache.keys().next().value);
      figPageCache.set(n, c);
      return c;
    }
    // Guess the figure's area: for a figure, from the last full line of body text above the caption down to the caption;
    // for a table, from the caption down to the next body text.
    function figureBand(f) {
      const h = pageInfo[f.page].h, w = pageInfo[f.page].w;
      const ls = lines.get(f.page) || [];
      const isBody = (l) => l.size > bodySize * 0.85 && l.size < bodySize * 1.15 && l.width > w * 0.35 && l.text.length > 40;
      if (f.kind === "figure") {
        const above = ls.filter((l) => l.top < f.top - 4 && isBody(l));
        let y0 = above.length ? above[above.length - 1].top + above[above.length - 1].size * 1.4 : h * 0.06;
        if (f.top - y0 < h * 0.08) y0 = Math.max(0, f.top - h * 0.4);
        return [y0, Math.min(h, f.top + bodySize * 3)];
      }
      const below = ls.filter((l) => l.top > f.top + h * 0.06 && isBody(l));
      const y1 = below.length ? below[0].top - 4 : Math.min(h, f.top + h * 0.45);
      return [Math.max(0, f.top - 4), y1];
    }
    // Trim the white margin around the figure so it fills the preview.
    function inkBox(src, y0, y1) {
      const w = src.width, h = Math.max(1, Math.floor(y1 - y0));
      const data = src.getContext("2d").getImageData(0, Math.floor(y0), w, h).data;
      let x0 = w, x1 = -1, r0 = h, r1 = -1;
      for (let y = 0; y < h; y += 2) {
        for (let x = 0; x < w; x += 2) {
          const i = (y * w + x) * 4;
          if (data[i] + data[i + 1] + data[i + 2] < 690) {
            if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < r0) r0 = y; if (y > r1) r1 = y;
          }
        }
      }
      if (x1 < 0) return { x: 0, y: y0, w, h };
      const pad = 14;
      const x = Math.max(0, x0 - pad), y = Math.max(0, r0 - pad);
      return { x, y: y0 + y, w: Math.min(w, x1 + pad) - x, h: Math.min(h, r1 + pad) - y };
    }
    async function drawFigure(canvas, f, cssW, maxH) {
      const [y0, y1] = figureBand(f);
      const src = await pageCanvas(f.page);
      const k = src.width / pageInfo[f.page].w;
      const box = inkBox(src, y0 * k, y1 * k);
      const dpr = window.devicePixelRatio || 1;
      const fit = Math.min(cssW / box.w, maxH / box.h);
      const w = Math.round(box.w * fit), h = Math.round(box.h * fit);
      canvas.width = w * dpr; canvas.height = h * dpr;
      canvas.style.width = `${w}px`; canvas.style.height = `${h}px`;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(src, box.x, box.y, box.w, box.h, 0, 0, canvas.width, canvas.height);
    }

    async function fetchJson(url, ms = 12000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), ms);
      try {
        const response = await fetch(url, { signal: controller.signal });
        if (!response.ok) throw new Error(String(response.status));
        return await response.json();
      } finally { clearTimeout(timer); }
    }
    // Google's public endpoint first, MyMemory as backup. A single word also gets its phonetic and senses.
    async function machineTranslate(raw) {
      const text = cleanSelection(raw).slice(0, 1800);
      const isWord = /^[A-Za-z][A-Za-z'-]{0,40}$/.test(text);
      try {
        const data = await fetchJson(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=zh-CN&dt=t&dt=bd&dt=rm&q=${encodeURIComponent(text)}`);
        const main = (data[0] || []).filter((row) => row && row[0]).map((row) => row[0]).join("");
        const out = [main];
        if (isWord) {
          const phonetic = (data[0] || []).find((row) => row && row[0] == null && row[3])?.[3];
          if (phonetic) out.push(`/${phonetic}/`);
          (data[1] || []).forEach(([pos, words]) => out.push(`${pos}：${words.slice(0, 6).join("、")}`));
        }
        return { main, text: out.filter(Boolean).join("\n") };
      } catch {
        try {
          const data = await fetchJson(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text.slice(0, 480))}&langpair=en|zh-CN`);
          const main = data.responseData.translatedText;
          return { main, text: `${main}${text.length > 480 ? "\n（备用翻译只翻了前 480 个字符）" : ""}` };
        } catch { return { main: "", text: "翻译服务连不上（可能没联网）。" }; }
      }
    }

    const apiKey = () => $("apiKey").value.trim();
    async function callAi(prompt, instructions = "You are a careful bilingual paper-reading assistant. Answer in Chinese, keep key English terms, and separate what the paper shows from your own interpretation.") {
      const provider = $("providerInput").value;
      const base = (provider === "custom" ? $("baseInput").value.trim() : PROVIDERS[provider].base).replace(/\/+$/, "");
      const model = $("modelInput").value.trim() || PROVIDERS[provider].model;
      if (!base) throw new Error("没填接口地址");
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 120000);
      try {
        // OpenAI uses its Responses API; DeepSeek and other compatible services use chat completions.
        const useResponses = provider === "openai";
        const response = await fetch(`${base}/${useResponses ? "responses" : "chat/completions"}`, {
          method: "POST", signal: controller.signal,
          headers: { "Content-Type": "application/json", "Authorization": `Bearer ${apiKey()}` },
          body: JSON.stringify(useResponses
            ? { model, input: prompt, instructions }
            : { model, messages: [{ role: "system", content: instructions }, { role: "user", content: prompt }] })
        });
        if (!response.ok) throw new Error(`${response.status} ${(await response.text()).slice(0, 200)}`);
        const data = await response.json();
        const text = useResponses
          ? data.output_text || (data.output || []).flatMap((o) => (o.content || []).map((c) => c.text || "")).join("\n").trim()
          : data.choices?.[0]?.message?.content?.trim();
        return text || "(AI 返回为空)";
      } catch (e) {
        throw controller.signal.aborted ? new Error("120 秒没有回应") : e;
      } finally { clearTimeout(timer); }
    }

    async function drainThumbs() {

      // Cards are added to the rail right after they are queued; let that happen,
      // and let the page the reader is looking at draw first.
      await new Promise((r) => setTimeout(r, 0));
      while (!rendered.size && token === loadToken) await new Promise((r) => setTimeout(r, 300));
      while (thumbQueue.length && token === loadToken) {
        const [canvas, f] = thumbQueue.shift();
        if (!canvas.isConnected) continue;
        const key = `${f.kind}${f.num}`;
        try {
          if (!thumbCache.has(key)) { const c = document.createElement("canvas"); await drawFigure(c, f, 96, 54); thumbCache.set(key, c); }
          const src = thumbCache.get(key);
          canvas.width = src.width; canvas.height = src.height;
          canvas.style.width = src.style.width; canvas.style.height = src.style.height;
          canvas.getContext("2d").drawImage(src, 0, 0);
        } catch {}

    $("skelDone").addEventListener("click", () => {
      if (!$("skelAnswer").value.trim()) { showToast("先用一句话写下这篇在解决什么问题。"); $("skelAnswer").focus(); return; }
      state.skeleton.done = true; save(); renderProgress(); setPass("read");
    });
    document.querySelectorAll("[data-recap]").forEach((f) => f.addEventListener("input", () => {
      state.recap[f.dataset.recap] = f.value;
      // The old verdict was about the old sentence.
      if (state.feedback[f.dataset.recap]) { delete state.feedback[f.dataset.recap]; renderFeedback(); }
      save(); renderProgress();
    }));
    document.querySelectorAll("[data-card]").forEach((f) => f.addEventListener("input", () => { state.card[f.dataset.card] = f.value; save(); }));
    $("checkRecap").addEventListener("click", checkRecap);
    $("fillCard").addEventListener("click", fillCard);
    $("draftCard").addEventListener("click", draftCard);
    $("copyMd").addEventListener("click", () => { const md = makeMarkdown(); $("mdOut").textContent = md; copyText(md); });
    $("downloadMd").addEventListener("click", downloadMd);
    $("toObsidian").addEventListener("click", toObsidian);
    $("askPaperBtn").addEventListener("click", askWholePaper);

    $("libToggle").addEventListener("click", () => document.body.classList.contains("lib-open") ? closeLibrary() : openLibrary());
    $("railToggle").addEventListener("click", () => document.body.classList.toggle("rail-open"));
    $("scrim").addEventListener("click", closeLibrary);
    $("settingsToggle").addEventListener("click", () => $("settings").classList.toggle("is-on"));
    $("saveSettings").addEventListener("click", () => {
      localStorage.setItem(KEY_KEY, apiKey());
      localStorage.setItem(PROVIDER_KEY, $("providerInput").value);
      localStorage.setItem(BASE_KEY, $("baseInput").value.trim());
      localStorage.setItem(MODEL_KEY, $("modelInput").value.trim());
      localStorage.setItem(VAULT_KEY, $("vaultInput").value.trim());
      localStorage.setItem(FOLDER_KEY, $("folderInput").value.trim());
      $("settings").classList.remove("is-on");
      showToast("已保存到这台设备的浏览器。");
    });
    $("clearKey").addEventListener("click", () => { localStorage.removeItem(KEY_KEY); $("apiKey").value = ""; showToast("API key 已清除。"); });

    document.addEventListener("keydown", (e) => { if (e.key === "Escape") { hidePops(); closeLibrary(); $("settings").classList.remove("is-on"); } });
    document.addEventListener("mousedown", (e) => {
      if (!e.target.closest(".pop")) hidePops();
      if (!e.target.closest("#settings, #settingsToggle")) $("settings").classList.remove("is-on");
    });

    $("addBtn").addEventListener("click", () => {
      const entry = parseSource($("addInput").value);
      if (!entry) { showToast("请输入 arXiv 编号（如 2403.15176）或以 http 开头的 PDF 链接。"); return; }
      $("addInput").value = "";
      addPaper(entry);
    });
    $("addInput").addEventListener("keydown", (e) => { if (e.key === "Enter") $("addBtn").click(); });
    $("uploadPdf").addEventListener("change", async (event) => {
      const file = event.target.files?.[0];
      if (!file) return;
      const bytes = await file.arrayBuffer();
      const id = `upload-${Date.now().toString(36)}`;
      try { await idbPut(id, bytes); } catch { showToast("这台设备不能保存上传的 PDF，只能本次阅读。"); }
      event.target.value = "";
      const list = library();
      list.unshift({ id, source: "upload", title: "", meta: `上传：${file.name}`, addedAt: new Date().toISOString() });
      saveLibrary(list);
      paper = { ...list[0] };
      state = loadState(id);
      localStorage.setItem(CURRENT_KEY, id);
      closeLibrary();
      $("paperTitle").textContent = "正在读取标题…";
      $("openSource").style.display = "none";
      renderLibrary(); restoreFields(); setPass(state.pass, false); buildTermRegex();
      await loadPdf({ data: new Uint8Array(bytes.slice(0)) });
    });
    $("paperTitle").addEventListener("blur", () => {
      const title = $("paperTitle").textContent.trim();
      if (paper && title && title !== paper.title && !title.startsWith("（")) updatePaper({ title });
    });
    $("paperTitle").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); $("paperTitle").blur(); } });
    $("prevPage").addEventListener("click", () => scrollToPos(Math.max(1, currentPage - 1), 0));
    $("nextPage").addEventListener("click", () => scrollToPos(Math.min(pdfDoc?.numPages || 1, currentPage + 1), 0));
    $("zoomIn").addEventListener("click", () => { userZoomed = true; scale = Math.min(2.4, scale + .15); applyScale(); });
    $("zoomOut").addEventListener("click", () => { userZoomed = true; scale = Math.max(.5, scale - .15); applyScale(); });
    $("copyPageText").addEventListener("click", async () => { if (pdfDoc) copyText(await pageTextOf(currentPage)); });
    let resizeTimer = null;
    window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(applyScale, 150); });

    // ---------- start ----------
    $("apiKey").value = localStorage.getItem(KEY_KEY) || "";
    // Version 2 only knew OpenAI, so a saved key without a provider is an OpenAI key.
    $("providerInput").value = localStorage.getItem(PROVIDER_KEY) || (localStorage.getItem(KEY_KEY) ? "openai" : "deepseek");
    $("baseInput").value = localStorage.getItem(BASE_KEY) || "";
    $("modelInput").value = localStorage.getItem(MODEL_KEY) || PROVIDERS[$("providerInput").value].model;
    function syncProvider() {
      const custom = $("providerInput").value === "custom";
      $("baseInput").classList.toggle("hidden", !custom);
      $("baseLabel").classList.toggle("hidden", !custom);
      $("modelInput").placeholder = PROVIDERS[$("providerInput").value].model || "模型名";
    }
    $("providerInput").addEventListener("change", () => { $("modelInput").value = PROVIDERS[$("providerInput").value].model; syncProvider(); });
    syncProvider();
    $("vaultInput").value = localStorage.getItem(VAULT_KEY) || "";
    $("folderInput").value = localStorage.getItem(FOLDER_KEY) || "";
    if (!library().length) saveLibrary([{ ...SAMPLE, addedAt: new Date().toISOString() }]);
    state = blankState();
    renderLibrary();
    const startId = localStorage.getItem(CURRENT_KEY);
    openPaper(library().some((p) => p.id === startId) ? startId : library()[0].id);

    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      window.addEventListener("load", () => { navigator.serviceWorker.register("./service-worker.js").catch(() => {}); });
    }

    async function guessTitle(doc) {
      try {
        const info = (await doc.getMetadata())?.info || {};
        if (info.Title && info.Title.trim().length > 8 && !/^untitled|\.pdf$|^microsoft word/i.test(info.Title.trim())) return info.Title.trim();
        const first = await (await doc.getPage(1)).getTextContent();
        // Horizontal text only: arXiv prints a large rotated stamp down the margin.
        const items = first.items.filter((i) => i.str.trim() && Math.abs(i.transform[1]) < 0.01 && Math.abs(i.transform[2]) < 0.01 && !/^arXiv:\d/i.test(i.str.trim()));
        if (!items.length) return "";
        const size = (i) => Math.abs(i.transform[3]);
        const max = Math.max(...items.map(size));
        // Group text into lines; a title in small caps mixes two font sizes on one line, so take whole lines.
        const rows = new Map();
        items.forEach((i) => { const y = Math.round(i.transform[5]); rows.set(y, [...(rows.get(y) || []), i]); });
        const ordered = [...rows.entries()].sort((a, b) => b[0] - a[0]).map(([, row]) => row);
        const big = (row) => Math.max(...row.map(size)) >= max * 0.9;
        const startLine = ordered.findIndex((row) => row.some((i) => size(i) >= max - 0.5));
        const titleLines = [];
        for (let k = startLine; k < ordered.length && big(ordered[k]); k++) titleLines.push(ordered[k]);
        // Join pieces that touch without a space; a real gap between words becomes one space.
        const joinRow = (row) => row.sort((a, b) => a.transform[4] - b.transform[4]).reduce((text, i, k, arr) => {
          if (k === 0) return i.str;
          const prev = arr[k - 1], gap = i.transform[4] - (prev.transform[4] + prev.width);
          return text + (gap > size(i) * 0.12 ? " " : "") + i.str;
        }, "");
        const title = titleLines.map(joinRow).join(" ").replace(/\s+/g, " ").trim();
        return title.length > 8 ? title.slice(0, 200) : "";
      } catch { return ""; }
    }
  </script>
